        <section class="container mt-5">
            <h2 class="text-center mb-4">Inscreva-se</h2>
            <hr />
            <form name="f_form" method="post">
        
              <label class="form-label">Nome:</label>
              <input  class="form-control" type="text" placeholder="Seu nome:" required nome="f_nome" />
            
              <label class="form-label">E-mail:</label>
              <input class="form-control" type="email" placeholder=" E-mail" required nome="f_emal" />
             
              <label class="form-label">Telefone:</label>
              
             <input class="form-control" type="tel" placeholder="Seu número:" required nome="f_tel" />
              <hr />
              <div class="d_bfom">
                <button class="btn btn-primary" type="submit" id="f_enviar" nome="f_butao">Enviar</button>
              </div>
